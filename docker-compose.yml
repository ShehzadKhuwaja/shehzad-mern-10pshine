services:
  backend:
    build: ./Backend
    container_name: backend_service
    ports:
      - "5000:5000"
    volumes:
      - ./Backend:/app
      - /app/node_modules
    restart: on-failure
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev"]